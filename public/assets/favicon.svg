<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef8a68"/>
      <stop offset="1" stop-color="#dc4f33"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9c9d4"/>
      <stop offset="1" stop-color="#f0a6ba"/>
    </linearGradient>
  </defs>

  <!-- cream rounded-square background -->
  <rect width="100" height="100" rx="22" fill="#f3f0e3"/>

  <!-- sun with white ring (upper left, behind book) -->
  <circle cx="40" cy="38" r="22" fill="#ffffff"/>
  <circle cx="40" cy="38" r="18.5" fill="url(#sun)"/>

  <!-- navy sparkles (top right, clear of the flower) -->
  <g fill="#31435f">
    <path d="M76 12.5 L77.9 18.1 L83.5 20 L77.9 21.9 L76 27.5 L74.1 21.9 L68.5 20 L74.1 18.1 Z"/>
    <path d="M83 32 L84.4 36.1 L88.5 37.5 L84.4 38.9 L83 43 L81.6 38.9 L77.5 37.5 L81.6 36.1 Z"/>
    <circle cx="69" cy="11" r="1.5"/>
    <circle cx="89" cy="26" r="1.3"/>
  </g>

  <!-- book cover (red, outermost) -->
  <path d="M50 46.5 C44 41.5 33 40.6 23 42.8 L23 69.4 C33 67.3 44 68.8 50 74.6 C56 68.8 67 67.3 77 69.4 L77 42.8 C67 40.6 56 41.5 50 46.5 Z" fill="#b23a3c"/>

  <!-- page-stack edge (blue-grey, peeks out around the white pages) -->
  <path d="M50 49.5 C45 45.4 34 44 24.6 46 L24.6 68 C34 66.2 45 67.6 50 72.8 C55 67.6 66 66.2 75.4 68 L75.4 46 C66 44 55 45.4 50 49.5 Z" fill="#9dabc0"/>

  <!-- white pages -->
  <path d="M50 45.5 C45 41.4 35.2 40.4 27 42.6 L27 66 C35.2 63.8 45 65.4 50 69.8 C55 65.4 64.8 63.8 73 66 L73 42.6 C64.8 40.4 55 41.4 50 45.5 Z" fill="#fdfcf6" stroke="#31435f" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- spine + bottom knob -->
  <path d="M50 45.5 L50 69.8" stroke="#31435f" stroke-width="1.6"/>
  <ellipse cx="50" cy="72.6" rx="5" ry="2.4" fill="#31435f"/>

  <!-- red circle (left page) -->
  <ellipse cx="38.5" cy="55.5" rx="8" ry="7" fill="#bd4a45"/>

  <!-- flower stem into the book -->
  <path d="M60.5 42 C59.5 50 57.5 56.5 55.5 61.5" stroke="#31435f" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- あ (right page) -->
  <text x="62.5" y="62.5" font-size="15" text-anchor="middle" fill="#2c3a58"
        font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-weight="700">あ</text>

  <!-- sakura blossom -->
  <g transform="translate(60,33)">
    <g fill="url(#petal)" stroke="#e58aa0" stroke-width="1.3" stroke-linejoin="round">
      <path d="M0,-2 C-4.5,-4 -7,-9 -5.5,-13 C-4.8,-15.2 -2.2,-15.8 -1,-13.8 C-0.6,-13.1 -0.3,-12.3 0,-11.2 C0.3,-12.3 0.6,-13.1 1,-13.8 C2.2,-15.8 4.8,-15.2 5.5,-13 C7,-9 4.5,-4 0,-2 Z"/>
      <path d="M0,-2 C-4.5,-4 -7,-9 -5.5,-13 C-4.8,-15.2 -2.2,-15.8 -1,-13.8 C-0.6,-13.1 -0.3,-12.3 0,-11.2 C0.3,-12.3 0.6,-13.1 1,-13.8 C2.2,-15.8 4.8,-15.2 5.5,-13 C7,-9 4.5,-4 0,-2 Z" transform="rotate(72)"/>
      <path d="M0,-2 C-4.5,-4 -7,-9 -5.5,-13 C-4.8,-15.2 -2.2,-15.8 -1,-13.8 C-0.6,-13.1 -0.3,-12.3 0,-11.2 C0.3,-12.3 0.6,-13.1 1,-13.8 C2.2,-15.8 4.8,-15.2 5.5,-13 C7,-9 4.5,-4 0,-2 Z" transform="rotate(144)"/>
      <path d="M0,-2 C-4.5,-4 -7,-9 -5.5,-13 C-4.8,-15.2 -2.2,-15.8 -1,-13.8 C-0.6,-13.1 -0.3,-12.3 0,-11.2 C0.3,-12.3 0.6,-13.1 1,-13.8 C2.2,-15.8 4.8,-15.2 5.5,-13 C7,-9 4.5,-4 0,-2 Z" transform="rotate(216)"/>
      <path d="M0,-2 C-4.5,-4 -7,-9 -5.5,-13 C-4.8,-15.2 -2.2,-15.8 -1,-13.8 C-0.6,-13.1 -0.3,-12.3 0,-11.2 C0.3,-12.3 0.6,-13.1 1,-13.8 C2.2,-15.8 4.8,-15.2 5.5,-13 C7,-9 4.5,-4 0,-2 Z" transform="rotate(288)"/>
    </g>
    <g stroke="#d76e88" stroke-width="1" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-4"/>
      <line x1="0" y1="0" x2="3.6" y2="-2"/>
      <line x1="0" y1="0" x2="3.6" y2="2"/>
      <line x1="0" y1="0" x2="0" y2="4"/>
      <line x1="0" y1="0" x2="-3.6" y2="2"/>
      <line x1="0" y1="0" x2="-3.6" y2="-2"/>
    </g>
    <g fill="#d76e88">
      <circle cx="0" cy="-4.4" r="0.9"/>
      <circle cx="4" cy="-2.2" r="0.9"/>
      <circle cx="4" cy="2.2" r="0.9"/>
      <circle cx="0" cy="4.4" r="0.9"/>
      <circle cx="-4" cy="2.2" r="0.9"/>
      <circle cx="-4" cy="-2.2" r="0.9"/>
    </g>
    <circle r="1.7" fill="#e58aa0"/>
  </g>
</svg>
